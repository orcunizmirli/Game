name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: GameCore on Linux
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --package-path Packages/GameCore
      - name: Validate levels and replay solutions
        run: |
          swift build -c release --package-path Packages/GameCore --product levelcheck
          Packages/GameCore/.build/release/levelcheck validate
          Packages/GameCore/.build/release/levelcheck replay

  ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build app (Debug, simulator)
        run: >
          xcodebuild build -quiet
          -project Game.xcodeproj -scheme Game -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - name: Build app (Release, device)
        run: >
          xcodebuild build -quiet
          -project Game.xcodeproj -scheme Game -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build-release
          CODE_SIGNING_ALLOWED=NO
      - name: GameCore tests on macOS
        run: swift test --package-path Packages/GameCore
      - name: Tests and screenshots on the simulator
        run: scripts/ci-simulator.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
